[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curd-puzzle"
dynamic = ["version"]
description = "Headless local file-puzzle analysis and Obsidian writeups"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
curd = "curd.cli:main"

[tool.setuptools]
packages = ["curd"]

[tool.setuptools.dynamic]
version = {attr = "curd.__version__"}
